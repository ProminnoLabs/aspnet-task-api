name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - run: dotnet build src/TaskApi --configuration Release
      - name: Smoke test
        shell: bash
        run: |
          dotnet run --project src/TaskApi --configuration Release --no-build -- --urls http://127.0.0.1:5050 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          pwsh -NoProfile -File tests/smoke.ps1
